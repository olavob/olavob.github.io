# Hugo configuration file
title: olavob.github.io
locale: "pt-BR"
defaultContentLanguage: "pt-br"
baseURL: "https://olavob.github.io"

theme: hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
    main:
      - name: Tema
        weight: 0
        params:
          type: theme-toggle
      # - name: Sobre
      #   pageRef: /about
      #   weight: 1
      # - name: Arquivo
      #   url: "/archives/"
      #   weight: 2
      - name: GitHub ↗
        url: "https://github.com/olavob"
        weight: 2
        params:
          icon: github
      - name: Buscar
        weight: 3
        params:
          type: search
      - name: Off-Topic
        weight: 1
        url: "/off-topic/"
      - name: Posts
        weight: -1
        url: "/posts/"

params:
  comments:
    enable: false
    type: giscus

    giscus:
      repo: "olavob/olavob.github.io"
      repoId: "R_kgDOO6MBAw"
      category: "Announcements"
      categoryId: "DIC_kwDOO6MBA84DJ8yR"
      data-mapping: "pathname"
      data-strict: "0"
      data-reactions-enabled: "1"
      data-emit-metadata: "0"
      data-input-position: "top"
      data-theme: "dark"
      data-lang: "pt"
      crossorigin: "anonymous"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true
    copyright: "© 2026 Olavo Bilac. Todos os direitos reservados."
  
  imageZoom:
    enable: true
  
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
  
  theme:
    default: dark
    displayToggle: false

  author:
    name: Olavp Bilac
    email: olavobilac.az@gmail.com

  description: "Blog do Olavo Bilac falando sobre tecnologia, carreira e coisas geek."

services: 
  disqus: 
    shortname: 'olavodotpys-blog'